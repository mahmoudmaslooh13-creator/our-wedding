h3{font-size:1rem;color:var(--mu);margin:10px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.opt{display:block;width:100%;text-align:start;background:var(--card);border:1.5px solid var(--bd);border-radius:14px;padding:12px;cursor:pointer;box-shadow:0 1px 4px #0001;transition:.2s;position:relative}

.opt.on:after{content:"✓";position:absolute;top:8px;left:10px;color:var(--gold);font-weight:700}
.opt:focus-visible,.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.nm{font-weight:700}.pr{color:var(--gold);font-weight:700}
.tag{display:inline-block;font-size:.72rem;color:var(--wr);border:1px solid var(--wr);border-radius:10px;padding:0 7px;margin-top:4px}
.note{background:var(--gl);border-radius:10px;padding:8px 12px;font-size:.88rem;margin:8px 0}
.warn{color:var(--wr)}
input[type=text],input[type=date],input[type=number],textarea{width:100%;background:var(--card);border:1.5px solid var(--bd);border-radius:10px;padding:8px 10px}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
label{font-size:.9rem;color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:0 2px 10px #0001}
.line{display:flex;justify-content:space-between;gap:8px;padding:3px 0;font-size:.92rem}
.tot{border-top:2px solid var(--gold);margin-top:6px;padding-top:6px;font-weight:800;font-size:1.15rem;color:var(--gold)}
.btn{border:1.5px solid var(--gold);background:var(--card);border-radius:12px;padding:8px 12px;cursor:pointer;margin:3px}
.btn.p{background:var(--gold);color:#fff}
.bottom{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--gold);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;z-index:9}
table{width:100%;border-collapse:collapse;font-size:.88rem}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:start;vertical-align:top}
.diff{background:var(--gl)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 16px;border-radius:20px;z-index:20}
.scroll{overflow-x:auto}
</style>
</head>
